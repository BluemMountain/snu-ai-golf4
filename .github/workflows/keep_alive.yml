name: Supabase Keep Alive

on:
  schedule:
    # Runs at 09:00 and 21:00 UTC every day (18:00 and 06:00 KST)
    - cron: '0 9,21 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run keep-alive script
        env:
          SUPABASE_URL: 'https://qfzmwlyqezmkkxtpscik.supabase.co'
          SUPABASE_KEY: 'sb_publishable_mYejtROOg-2JN7z6_RlWdg_PXYSYgFi'
        run: node keep_alive.js
