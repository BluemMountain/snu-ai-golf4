name: Supabase Keep Alive

on:
  schedule:
    # Runs at 09:00 and 21:00 UTC every day (18:00 and 06:00 KST)
    - cron: '0 9,21 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run keep-alive script
        run: node keep_alive.js
