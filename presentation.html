        let logsData = EMBEDDED_LOGS;
        let currentEventIndex = 0;
        let currentPhotoIndex = 0;
        let autoPlayTimer = null;
        let progressInterval = null;
        let isPlaying = false;
        let slideDuration = 4000;
        let progressElapsed = 0;

        document.addEventListener('DOMContentLoaded', () => {
            initSlides(EMBEDDED_LOGS);
            setupKeyboard();
            fetchLogsDynamic();
            setTimeout(() => fireConfetti(), 500);
        });

        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 70,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#f1c40f', '#d35400', '#2ecc71', '#ffffff']
                });
            }
        }

        function initSlides(data) {
            data.forEach(log => {
                let dStr = (log.date || '').replace(/\./g, '-').replace(/\s+/g, '');
                if (dStr.length === 8 && !dStr.includes('-')) {
                    dStr = `${dStr.substring(0, 4)}-${dStr.substring(4, 6)}-${dStr.substring(6, 8)}`;
                }
                const parts = dStr.split('-');
                if (parts.length === 3) {
                    log.normalizedDate = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                } else {
                    log.normalizedDate = dStr;
                }
            });

            logsData = data.sort((a, b) => a.normalizedDate.localeCompare(b.normalizedDate));
            renderTimeline();
            renderSlides();
            showEvent(currentEventIndex, currentPhotoIndex);
        }

        async function fetchLogsDynamic() {
            try {
                const SUPABASE_URL = 'https://qfzmwlyqezmkkxtpscik.supabase.co';
                const SUPABASE_KEY = 'sb_publishable_mYejtROOg-2JN7z6_RlWdg_PXYSYgFi';
                
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    const { data, error } = await client.from('round_logs').select('*');
                    if (!error && data && data.length > 0) {
                        const clean = data.map(l => ({
                            id: l.id,
                            date: l.date,
                            location: l.location,
                            quote: l.quote || l.title || '',
                            image_urls: l.image_urls || (l.image_url ? [l.image_url] : [])
                        }));
                        initSlides(clean);
                    }
                }
            } catch (err) {
                console.log("Background fetch info:", err);
            }
        }

        function renderTimeline() {
            const bar = document.getElementById('timeline-bar');
            bar.innerHTML = '';
            logsData.forEach((log, idx) => {
                const item = document.createElement('div');
                item.className = `timeline-item ${idx === 0 ? 'active' : ''}`;
                item.textContent = `${log.date} ${log.location}`;
                item.onclick = () => showEvent(idx, 0);
                bar.appendChild(item);
            });
        }

        function renderSlides() {
            const container = document.getElementById('slides-container');
            container.innerHTML = '';

            logsData.forEach((log, eIdx) => {
                const card = document.createElement('div');
                card.className = `slide-card ${eIdx === 0 ? 'active' : ''}`;
                card.id = `slide-card-${eIdx}`;

                const images = log.image_urls || [];
                const quote = log.quote || log.title || '';

                let thumbsHtml = '';
                let gridHtml = '';
                images.forEach((imgUrl, pIdx) => {
                    thumbsHtml += `
                        <div class="thumb-item ${pIdx === 0 ? 'active' : ''}" id="thumb-${eIdx}-${pIdx}" onclick="showEvent(${eIdx}, ${pIdx})">
                            <img src="${imgUrl}" alt="Thumbnail" loading="lazy">
                        </div>
                    `;
                    gridHtml += `
                        <div class="grid-drawer-item ${pIdx === 0 ? 'active' : ''}" id="grid-item-${eIdx}-${pIdx}" onclick="selectFromGrid(${eIdx}, ${pIdx})">
                            <img src="${imgUrl}" alt="Photo ${pIdx + 1}" loading="lazy">
                            <span class="grid-drawer-num">#${pIdx + 1}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="slide-header">
                        <div>
                            <div class="slide-date-loc">
                                <span>📅 ${log.date}</span>
                                <span>📍 ${log.location}</span>
                            </div>
                            <h2 class="slide-title">${quote || log.location + ' 라운드 기록'}</h2>
                        </div>
                        <div class="slide-header-right">
                            <div class="slide-count-badge" id="photo-count-badge-${eIdx}">
                                <i class="fas fa-camera"></i> 사진 1 / ${images.length}
                            </div>
                        </div>
                    </div>
                    
                    <div class="photo-stage-container">
                        ${images.length > 1 ? `
                            <button class="photo-sub-btn left" onclick="prevPhoto(${eIdx})" title="이전 사진"><i class="fas fa-chevron-left"></i></button>
                            <button class="photo-sub-btn right" onclick="nextPhoto(${eIdx})" title="다음 사진"><i class="fas fa-chevron-right"></i></button>
                        ` : ''}

                        <div class="main-photo-wrapper">
                            <img id="main-photo-${eIdx}" src="${images[0] || ''}" alt="${quote}" onclick="openLightbox(this.src)">
                        </div>

                        <div class="grid-drawer" id="grid-drawer-${eIdx}">
                            ${gridHtml}
                        </div>

                        ${images.length > 1 ? `
                            <div class="thumbnail-strip" id="thumb-strip-${eIdx}">
                                ${thumbsHtml}
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function showEvent(eventIndex, photoIndex = 0) {
            if (eventIndex < 0) eventIndex = logsData.length - 1;
            if (eventIndex >= logsData.length) eventIndex = 0;

            currentEventIndex = eventIndex;
            const images = logsData[currentEventIndex].image_urls || [];

            if (photoIndex < 0) photoIndex = images.length - 1;
            if (photoIndex >= images.length) photoIndex = 0;
            currentPhotoIndex = photoIndex;

            // Toggle slide cards
            document.querySelectorAll('.slide-card').forEach((card, idx) => {
                card.classList.toggle('active', idx === currentEventIndex);
            });

            // Toggle timeline item
            document.querySelectorAll('.timeline-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === currentEventIndex);
                if (idx === currentEventIndex) {
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });

            // Update main photo & ambient backdrop
            const currentImgUrl = images[currentPhotoIndex] || '';
            const mainImg = document.getElementById(`main-photo-${currentEventIndex}`);
            if (mainImg && currentImgUrl) {
                mainImg.classList.remove('ken-burns');
                mainImg.src = currentImgUrl;
                void mainImg.offsetWidth; // trigger reflow for animation
                mainImg.classList.add('ken-burns');
            }

            const backdrop = document.getElementById('ambient-backdrop');
            if (backdrop && currentImgUrl) {
                backdrop.style.backgroundImage = `url('${currentImgUrl}')`;
            }

            const badge = document.getElementById(`photo-count-badge-${currentEventIndex}`);
            if (badge) {
                badge.innerHTML = `<i class="fas fa-camera"></i> 사진 ${currentPhotoIndex + 1} / ${images.length}`;
            }

            // Update active thumbnail
            const thumbs = document.querySelectorAll(`#thumb-strip-${currentEventIndex} .thumb-item`);
            thumbs.forEach((t, pIdx) => {
                t.classList.toggle('active', pIdx === currentPhotoIndex);
                if (pIdx === currentPhotoIndex) {
                    t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });

            // Update active grid item
            const gridItems = document.querySelectorAll(`#grid-drawer-${currentEventIndex} .grid-drawer-item`);
            gridItems.forEach((g, pIdx) => {
                g.classList.toggle('active', pIdx === currentPhotoIndex);
            });

            // Update bottom control slide indicator
            document.getElementById('slide-indicator').textContent = `${currentEventIndex + 1} / ${logsData.length} 행사`;
            resetProgress();
        }

        function toggleGridDrawer() {
            const drawer = document.getElementById(`grid-drawer-${currentEventIndex}`);
            const btn = document.getElementById('grid-toggle-btn');
            if (drawer) {
                const isOpen = drawer.classList.toggle('open');
                btn.classList.toggle('active', isOpen);
            }
        }

        function selectFromGrid(eIdx, pIdx) {
            const drawer = document.getElementById(`grid-drawer-${eIdx}`);
            const btn = document.getElementById('grid-toggle-btn');
            if (drawer) drawer.classList.remove('open');
            if (btn) btn.classList.remove('active');
            showEvent(eIdx, pIdx);
        }

        function nextStep() {
            const images = logsData[currentEventIndex].image_urls || [];
            if (currentPhotoIndex + 1 < images.length) {
                showEvent(currentEventIndex, currentPhotoIndex + 1);
            } else {
                showEvent(currentEventIndex + 1, 0);
            }
        }

        function prevStep() {
            if (currentPhotoIndex > 0) {
                showEvent(currentEventIndex, currentPhotoIndex - 1);
            } else {
                const prevEvtIdx = currentEventIndex - 1 < 0 ? logsData.length - 1 : currentEventIndex - 1;
                const prevImgs = logsData[prevEvtIdx].image_urls || [];
                showEvent(prevEvtIdx, prevImgs.length - 1);
            }
        }

        function nextEvent() {
            showEvent(currentEventIndex + 1, 0);
        }

        function prevEvent() {
            showEvent(currentEventIndex - 1, 0);
        }

        function nextPhoto(eIdx) {
            if (eIdx !== currentEventIndex) return;
            nextStep();
        }

        function prevPhoto(eIdx) {
            if (eIdx !== currentEventIndex) return;
            prevStep();
        }

        function resetProgress() {
            progressElapsed = 0;
            const bar = document.getElementById('autoplay-progress');
            if (bar) bar.style.width = '0%';
        }

        function startAutoPlayTimers() {
            clearInterval(autoPlayTimer);
            clearInterval(progressInterval);
            resetProgress();

            progressInterval = setInterval(() => {
                progressElapsed += 100;
                const pct = Math.min((progressElapsed / slideDuration) * 100, 100);
                const bar = document.getElementById('autoplay-progress');
                if (bar) bar.style.width = pct + '%';
            }, 100);

            autoPlayTimer = setInterval(() => {
                nextStep();
            }, slideDuration);
        }

        function toggleAutoPlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(autoPlayTimer);
                clearInterval(progressInterval);
                isPlaying = false;
                btn.innerHTML = '<i class="fas fa-play"></i>';
                resetProgress();
            } else {
                isPlaying = true;
                btn.innerHTML = '<i class="fas fa-pause"></i>';
                startAutoPlayTimers();
            }
        }

        function changeSpeed(ms) {
            slideDuration = Number(ms);
            if (isPlaying) {
                startAutoPlayTimers();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    nextStep();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevStep();
                } else if (e.key === 'f' || e.key === 'F') {
                    toggleFullScreen();
                } else if (e.key === 'g' || e.key === 'G') {
                    toggleGridDrawer();
                }
            });
        }

        function openLightbox(url) {
            if (!url) return;
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-modal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
        }
    </script>
</body>

</html>
